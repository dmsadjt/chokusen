spring:
  application:
    name: chokusen
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chokusen}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  profiles:
    active: local

logging:
  level:
    org.springframework.security: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  security:
    public-endpoints:
      - /api/v1/auth/**
      - /error
      - /ws/**
      - /api/v1/health
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
